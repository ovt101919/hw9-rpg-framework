<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狗血劇編劇生存戰</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 主容器 -->
    <div class="game-container">
        
        <!-- 首頁專屬：標題視覺區塊 -->
        <div class="landing-hero">
            <h1 class="game-title">《狗血劇編劇生存戰》</h1>
            <p class="game-subtitle">挑戰全網最荒謬的劇情走向</p>
        </div>

        <!-- 首頁專屬：前導情境介紹 -->
        <div class="dialogue-container">
            <p class="text-content">「卡！卡！卡！收視率又掉下來了！」</p>
            <p class="text-content">製作人氣急敗壞地把收視率報表摔在桌上。「現在的觀眾口味很重的！我們需要更瘋狂、更反轉、更不講邏輯的橋段！」</p>
            <p class="text-content" style="margin-top: 15px; color: #8B7355; font-weight: bold;">身為電視台剛入職的菜鳥編劇，你的每一個選擇，都將決定這部劇是成為年度國民神劇，還是慘遭腰斬停播。準備好發揮你的腦洞了嗎？</p>
        </div>

        <!-- 首頁專屬：登入表單與按鈕 -->
        <div class="choices-wrapper">
            <!-- 讓玩家輸入暱稱的欄位 -->
            <input type="text" class="player-input" placeholder="請輸入你的王牌編劇筆名...">
            <!-- 點擊後正式進入第一段劇情 -->
            <a href="node_drama_start.html" class="choice-btn">開始撰寫劇本</a>
        </div>

    </div>
</body>
</html>
